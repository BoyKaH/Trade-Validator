  <title>Pre-Trade Validator</title>
  <style>

  <script>
  "use strict";

  const STORAGE_KEY = "ptv_v8";

  const STATE_QUESTIONS = [
    {id:"identity",text:"Est-ce que cette action est cohérente avec le trader que je suis en train de devenir ?",help:"Pas : « est-ce que j’ai raison sur ce trade ? »",healthy:"yes",cause:"Action incohérente avec le trader que je deviens",incidentType:"identity"}

  const DEFAULT_CRITERIA = [

  ];
  // Trade évité (ex-« FOMO évité ») : compteur de retenue, la raison est facultative. L’id "market" garde l’ancien choix « Marché ».
  const AVOID_REASONS = [{id:"market",label:"FOMO"},{id:"impulse",label:"Impulsif"},{id:"discord",label:"Discord"},{id:"result",label:"Résultat"}];

  async function readRemote(cfg){

      if(repo.ok)return {exists:false,sha:"",data:null};

  function entryStamp(entry){return String(entry.updatedAt||entry.createdAt||"");}
  // Fusion entrée par entrée : la version modifiée en dernier gagne, une suppression plus récente l’emporte.
  function mergeSyncData(local,remote){
    const tombstones=normalizeTombstones(local.tombstones),rt=normalizeTombstones(remote&&remote.tombstones);
    ["journal","fields"].forEach(g=>Object.keys(rt[g]).forEach(id=>{tombstones[g][id]=Math.max(tombstones[g][id]||0,rt[g][id]);}));
    const byId=new Map();
    local.journal.forEach(entry=>byId.set(entry.id,entry));
    (Array.isArray(remote&&remote.journal)?remote.journal:[]).slice(0,5000).map(normalizeJournalEntry).forEach(entry=>{
      const mine=byId.get(entry.id);
      if(!mine){byId.set(entry.id,entry);return;}
      const winner=entryStamp(entry)>entryStamp(mine)?entry:mine,other=winner===entry?mine:entry;
      if(winner.kind==="trade"&&other.kind==="trade"){winner.exported=winner.exported||other.exported;winner.lossAt=winner.lossAt||other.lossAt;}
      byId.set(entry.id,winner);
    });
    const journal=[...byId.values()].filter(entry=>{const dead=tombstones.journal[entry.id];return !dead||Date.parse(entryStamp(entry))>dead;});
    const fields=normalizeJournalFields(local.journalFields.concat(normalizeJournalFields(remote&&remote.journalFields))).filter(field=>!tombstones.fields[field.id]);
    const seen=new Set(),log=[];

  // Empreinte indépendante de l’ordre : évite un commit GitHub quand rien n’a changé.

  async function syncNow(manual){

    if(syncState.running){syncState.again=true;return false;}
    if(navigator.onLine===false){if(manual)showToast("Hors ligne : la synchro reprendra au retour du réseau.");return false;}
    syncState.running=true;syncState.lastAttempt=Date.now();clearTimeout(syncState.timer);
    const before=journalSignature();let ok=false;

        const remote=await readRemote(cfg);
        const merged=mergeSyncData({journal:app.journal,journalFields:app.journalFields,tombstones:app.tombstones,verdictLog:app.verdictLog,nextTradeNum:app.settings.nextTradeNum},remote.data);
        app.journal=merged.journal;app.journalFields=merged.journalFields;app.tombstones=merged.tombstones;app.verdictLog=merged.verdictLog;app.settings.nextTradeNum=merged.nextTradeNum;
        try{localStorage.setItem(STORAGE_KEY,JSON.stringify(app));}catch(error){console.warn("Sauvegarde locale après synchro impossible",error);}
        const remoteSig=remote.data?canonicalSyncSig(remote.data):"",mergedSig=canonicalSyncSig(merged);
        if(remote.exists&&remoteSig===mergedSig){cfg.lastSha=remote.sha;ok=true;break;}
        const written=await writeRemote(cfg,syncPayload(merged),remote.sha);

      const typing=document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if(journalSignature()!==before&&!activeSheet&&(currentView==="journal"||!typing))render();
      if(activeSheet==="config")renderConfig();
      if(syncState.again){syncState.again=false;scheduleSync(1500);}
    }

  }

    const age=Math.max(0,(at-found.at)/60000);

  function disciplineStats(){
    const days=new Map(),get=d=>{if(!days.has(d))days.set(d,{bad:0,avoided:0,skip:0,conform:0});return days.get(d);};
    let avoidedTotal=0,skipTotal=0;
    app.journal.forEach(e=>{
      if(!e.date)return;const d=get(e.date);
      if(e.kind==="avoided"){d.avoided++;avoidedTotal++;}
      else if(e.kind==="no_trade"){d.skip++;skipTotal++;}
      else if(!(e.auto&&e.auto.category==="ok"))d.bad++;
      // Trade conforme : +1 seulement si le plan est aussi déclaré respecté (sinon 0, sans casser la série).
      else if(e.plan==="Oui")d.conform++;
    });
    // Série = jours avec au moins une entrée et aucun trade hors process ou sans validation. Un jour sans entrée ne la casse pas.
    // Une journée n’a pas de valeur en soi : seules les actions rapportent des points.
    const todayKey=todayNyKey();let points=0,todayPoints=0,streak=0,bestStreak=0;
    [...days.keys()].sort().forEach(key=>{
      const d=days.get(key),dayPoints=Math.min(d.avoided,5)+Math.min(d.skip,1)+d.conform;

  }

  function validateBackupRoot(parsed){
    if(!isPlainObject(parsed))throw new Error("Le fichier JSON est invalide.");
    let source;
    if(Object.prototype.hasOwnProperty.call(parsed,"format")){
      if(parsed.format!==BACKUP_FORMAT)throw new Error("Ce fichier n’est pas une sauvegarde Pre-Trade Validator.");
      if(parsed.formatVersion!==BACKUP_FORMAT_VERSION)throw new Error("Cette version de sauvegarde n’est pas prise en charge.");
      if(![5,6,7,8].includes(parsed.appVersion)||!isPlainObject(parsed.data))throw new Error("La sauvegarde est incomplète.");
      source=parsed.data;
    }else if([5,6,7,8].includes(parsed.version))source=parsed;
    else throw new Error("Version de sauvegarde incompatible.");
    ["instruments","criteria","incidents"].forEach(key=>{
      if(!Array.isArray(source[key]))throw new Error("Sauvegarde incomplète : "+key+".");
    });
    if(!isPlainObject(source.settings)||!isPlainObject(source.setups))throw new Error("La structure de la sauvegarde est invalide.");
    const nq=source.instruments.find(item=>String(item&&item.name||"").trim().toUpperCase()==="NQ");

  function upcomingToiAlerts(now=new Date()){
    const p=newYorkParts(now),lead=app.settings.toiLeadMinutes,alerts=[],selected=new Set(app.settings.toiAlertWindows||[]);
    const firstDate=new Date(Date.UTC(p.year,p.month-1,p.day)),calendarEnd=new Date(NQ_CALENDAR.through+"T00:00:00Z");
    const horizonDays=Math.max(0,Math.min(500,Math.ceil((calendarEnd-firstDate)/86400000)));
    for(let offset=0;offset<=horizonDays;offset++){
      const date=new Date(Date.UTC(p.year,p.month-1,p.day+offset)),schedule=marketDay(date),day=date.getUTCDay();
      if(!schedule.covered)continue;
      REFERENCE_WINDOWS.forEach(session=>{
        if(!session.days.includes(day))return;
        session.windows.forEach((window,windowIndex)=>schedule.hours.forEach(([open,close])=>{
          const windowId=toiWindowId(session,windowIndex);if(!selected.has(windowId))return;
          const start=Math.max(window[0],open),end=Math.min(window[1],close);
          if(start>=end)return;
          const startAt=newYorkInstant(date.getUTCFullYear(),date.getUTCMonth()+1,date.getUTCDate(),start);
          const endAt=newYorkInstant(date.getUTCFullYear(),date.getUTCMonth()+1,date.getUTCDate(),end);
          const alertAt=startAt-lead*60000;
          if(alertAt<=now.getTime()+5000)return;
          const star=session.preferred?"★ ":"";
          alerts.push({
            id:"toi-"+startAt+"-"+windowId,at:alertAt,startAt:startAt,endAt:endAt,
            title:"TOI dans "+lead+" min — "+star+session.name,
            body:parisRange(startAt,endAt)
          });
        }));
      });
    }
    return alerts.sort((a,b)=>a.at-b.at);
  }

      if(announce)showToast(result.scheduledCount+" alerte"+(result.scheduledCount>1?"s":"")+" TOI programmée"+(result.scheduledCount>1?"s":"")+".");

      const registration=await navigator.serviceWorker.register("./sw.js");
      if(registration.waiting&&navigator.serviceWorker.controller)showUpdateBanner();
      registration.addEventListener("updatefound",()=>{
        const worker=registration.installing;if(!worker)return;
        worker.addEventListener("statechange",()=>{if(worker.state==="installed"&&navigator.serviceWorker.controller)showUpdateBanner();});
      });
      registration.update().catch(()=>{});
    }catch(error){console.warn("Mode hors ligne indisponible",error);}
  });

  loadApp();
  render();
  updateTiming();
  syncAndroidToiNotifications(false);
  setInterval(updateTiming,1000);
  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden){updateTiming();syncAndroidToiNotifications(false);syncIfStale();}
    else if(loadSyncConfig()&&(journalSignature()!==syncState.lastJournalSig||lastLogAt()>syncState.lastPushedLogAt))void syncNow(false);
  });
  window.addEventListener("focus",syncIfStale);
  // Historique des verdicts : envoyé au plus toutes les 10 min pour limiter les commits.
  setInterval(()=>{if(!document.hidden&&loadSyncConfig()&&lastLogAt()>syncState.lastPushedLogAt)void syncNow(false);},10*60000);
  // Relecture régulière quand l’appli reste ouverte : une suppression faite sur l’autre appareil arrive en 2 min au plus (pas d’écriture si rien n’a changé).
  setInterval(()=>{if(!document.hidden)syncIfStale();},2*60000);
  void syncNow(false);
  window.PTV={
    getVerdict:getVerdict,save:saveNow,exportData:()=>clone(app),resetCurrentSetup:resetCurrentSetup,
    migrateV4ToV5:migrateV4ToV5,
    makeBackup:()=>clone(makeBackupPayload()),validateBackup:raw=>clone(validateBackupRoot(raw)),exportBackup:exportBackup,isStandalone:isStandaloneMode,
    upcomingToiAlerts:()=>clone(upcomingToiAlerts()),syncAndroidToiNotifications:syncAndroidToiNotifications,
    lookupVerdict:(date,time)=>clone(lookupVerdict(date,time)),journalStats:()=>clone(journalStats()),journalRows:()=>clone(journalRows(sortedTrades()))
  };
  </script>
</body>
</html>
