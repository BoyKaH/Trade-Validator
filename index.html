  <title>Pre-Trade Validator</title>
  <style>

  function migrateV4ToV5(old){

  async function shareOrDownload(blob,filename,mime,title){

      canShare=!!(file&&typeof navigator.share==="function"&&typeof navigator.canShare==="function"&&navigator.canShare({files:[file]}));
    }catch(error){console.warn("Partage de fichier indisponible",error);}
    if(canShare){
      try{await navigator.share({files:[file],title:title});return true;}
      catch(error){if(error&&error.name==="AbortError")return false;console.warn("Partage indisponible, téléchargement utilisé",error);}
    }
    try{downloadBackupBlob(blob,filename);return true;}catch(error){console.warn("Téléchargement impossible",error);showToast("Export impossible.");return false;}
  }

  function validateBackupRoot(parsed){
    if(!isPlainObject(parsed))throw new Error("Le fichier JSON est invalide.");
    let source;
    if(Object.prototype.hasOwnProperty.call(parsed,"format")){
      if(parsed.format!==BACKUP_FORMAT)throw new Error("Ce fichier n’est pas une sauvegarde Pre-Trade Validator.");
      if(parsed.formatVersion!==BACKUP_FORMAT_VERSION)throw new Error("Cette version de sauvegarde n’est pas prise en charge.");
      if(![5,6,7,8].includes(parsed.appVersion)||!isPlainObject(parsed.data))throw new Error("La sauvegarde est incomplète.");
      source=parsed.data;
    }else if([5,6,7,8].includes(parsed.version))source=parsed;
    else throw new Error("Version de sauvegarde incompatible.");
    ["instruments","criteria","incidents"].forEach(key=>{
      if(!Array.isArray(source[key]))throw new Error("Sauvegarde incomplète : "+key+".");
    });
    if(!isPlainObject(source.settings)||!isPlainObject(source.setups))throw new Error("La structure de la sauvegarde est invalide.");
    const nq=source.instruments.find(item=>String(item&&item.name||"").trim().toUpperCase()==="NQ");
    if(!nq||typeof nq.id!=="string"||!isPlainObject(source.setups[nq.id]))throw new Error("Le setup NQ est absent de la sauvegarde.");
    const candidate=normalizeApp(source);
    if(!candidate||candidate.version!==8||!candidate.currentId||!isPlainObject(candidate.setups[candidate.currentId]))throw new Error("Impossible de restaurer cette sauvegarde.");
    return candidate;
  }

  function upcomingToiAlerts(now=new Date()){
    const p=newYorkParts(now),lead=app.settings.toiLeadMinutes,alerts=[],selected=new Set(app.settings.toiAlertWindows||[]);
    const firstDate=new Date(Date.UTC(p.year,p.month-1,p.day)),calendarEnd=new Date(NQ_CALENDAR.through+"T00:00:00Z");
    const horizonDays=Math.max(0,Math.min(500,Math.ceil((calendarEnd-firstDate)/86400000)));
    for(let offset=0;offset<=horizonDays;offset++){
      const date=new Date(Date.UTC(p.year,p.month-1,p.day+offset)),schedule=marketDay(date),day=date.getUTCDay();
      if(!schedule.covered)continue;
      REFERENCE_WINDOWS.forEach(session=>{
        if(!session.days.includes(day))return;
        session.windows.forEach((window,windowIndex)=>schedule.hours.forEach(([open,close])=>{
          const windowId=toiWindowId(session,windowIndex);if(!selected.has(windowId))return;
          const start=Math.max(window[0],open),end=Math.min(window[1],close);
          if(start>=end)return;
          const startAt=newYorkInstant(date.getUTCFullYear(),date.getUTCMonth()+1,date.getUTCDate(),start);
          const endAt=newYorkInstant(date.getUTCFullYear(),date.getUTCMonth()+1,date.getUTCDate(),end);
          const alertAt=startAt-lead*60000;
          if(alertAt<=now.getTime()+5000)return;
          const star=session.preferred?"★ ":"";
          alerts.push({
            id:"toi-"+startAt+"-"+windowId,at:alertAt,startAt:startAt,endAt:endAt,
            title:"TOI dans "+lead+" min — "+star+session.name,
            body:parisRange(startAt,endAt)
          });
        }));
      });
    }
    return alerts.sort((a,b)=>a.at-b.at);
  }

      if(selected.has(target.dataset.id))selected.delete(target.dataset.id);else selected.add(target.dataset.id);
      app.settings.toiAlertWindows=allToiWindowIds(false).filter(windowId=>selected.has(windowId));
      saveNow();syncAndroidToiNotifications(true);renderConfig();
    }
    else if(action==="journal-save")saveJournalDraft();
    else if(action==="journal-delete"){if(journalDraft&&journalDraft.id)requestDeleteJournal(journalDraft.id);}
    else if(action==="jf-add")addJournalField();
    else if(action==="jf-delete")requestDeleteJournalField(target.dataset.id);
    else if(action==="copy-mark")markCopied();
    else if(action==="copy-select"){const area=document.getElementById("copy-area");if(area){area.focus();area.select();}}
    else if(action==="reset-current")requestResetCurrent();
    else if(action==="full-reset")requestFullReset();
  });
  document.getElementById("sheet-body").addEventListener("change",event=>{
    if(event.target.id==="backup-import-file"){void prepareBackupImport(event.target);return;}
    const jfield=event.target.dataset.jfield;
    if(journalDraft&&(jfield==="date"||jfield==="time")){journalDraft.values[jfield]=event.target.value;applyLookupPrefill();renderJournalForm();return;}
    if(journalDraft&&jfield==="plan"){journalDraft.values.plan=event.target.value;journalDraft.touched.add("plan");renderJournalForm();return;}
    if(event.target.dataset.jsetting){applyJournalSetting(event.target);return;}
    const field=event.target.dataset.cfgField,key=event.target.dataset.setting;
    if(field==="setting-check"&&key==="haptics"){
      app.settings.haptics=event.target.checked;saveNow();render();return;
    }
    if(field==="setting-check"&&key==="toiNotifications"){
      app.settings[key]=event.target.checked;saveNow();
      if(event.target.checked){const bridge=androidBridge();if(bridge)bridge.requestNotificationPermission();}
      syncAndroidToiNotifications(true);renderConfig();return;
    }
    if(field==="setting-select"&&key==="toiLeadMinutes"){
      const value=Number(event.target.value);if(![5,10,15,30].includes(value))return;
      app.settings.toiLeadMinutes=value;saveNow();syncAndroidToiNotifications(true);renderConfig();
    }
  });
  document.getElementById("sheet-body").addEventListener("input",event=>{
    const target=event.target;if(!journalDraft)return;
    if(target.dataset.jfield&&!["date","time","plan"].includes(target.dataset.jfield)){journalDraft.values[target.dataset.jfield]=target.value;journalDraft.touched.add(target.dataset.jfield);}
    else if(target.dataset.jcustom)journalDraft.values.custom[target.dataset.jcustom]=target.value;
  });
  document.addEventListener("keydown",event=>{
    if(event.key!=="Escape")return;
    if(document.getElementById("confirm-overlay").classList.contains("open"))closeConfirm();else if(activeSheet)closeSheet();
  });
  window.addEventListener("beforeunload",saveNow);
  window.addEventListener("online",updateConnectionStatus);
  window.addEventListener("offline",updateConnectionStatus);
  window.addEventListener("android-bridge-ready",()=>{syncAndroidToiNotifications(false);if(activeSheet==="config")renderConfig();});
  window.addEventListener("android-notification-permission-changed",()=>{syncAndroidToiNotifications(false);if(activeSheet==="config")renderConfig();});
  window.addEventListener("beforeinstallprompt",event=>{
    event.preventDefault();deferredInstallPrompt=event;
  });
  window.addEventListener("appinstalled",()=>{
    deferredInstallPrompt=null;showToast("Application installée.");if(activeSheet==="config")renderConfig();
  });
  function showUpdateBanner(){updateAvailable=true;document.getElementById("update-banner").classList.add("show");}
  window.addEventListener("load",async()=>{
    if(!hasSecureAppContext()||!("serviceWorker" in navigator)||typeof navigator.serviceWorker.register!=="function")return;
    try{
      const registration=await navigator.serviceWorker.register("./sw.js");
      if(registration.waiting&&navigator.serviceWorker.controller)showUpdateBanner();
      registration.addEventListener("updatefound",()=>{
        const worker=registration.installing;if(!worker)return;
        worker.addEventListener("statechange",()=>{if(worker.state==="installed"&&navigator.serviceWorker.controller)showUpdateBanner();});
      });
      registration.update().catch(()=>{});
    }catch(error){console.warn("Mode hors ligne indisponible",error);}
  });

  loadApp();
  render();
  updateTiming();
  syncAndroidToiNotifications(false);
  setInterval(updateTiming,1000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){updateTiming();syncAndroidToiNotifications(false);}});
  window.PTV={
    getVerdict:getVerdict,save:saveNow,exportData:()=>clone(app),resetCurrentSetup:resetCurrentSetup,
    migrateV4ToV5:migrateV4ToV5,
    makeBackup:()=>clone(makeBackupPayload()),validateBackup:raw=>clone(validateBackupRoot(raw)),exportBackup:exportBackup,isStandalone:isStandaloneMode,
    upcomingToiAlerts:()=>clone(upcomingToiAlerts()),syncAndroidToiNotifications:syncAndroidToiNotifications,
    lookupVerdict:(date,time)=>clone(lookupVerdict(date,time)),journalStats:()=>clone(journalStats()),journalRows:()=>clone(journalRows(sortedTrades()))
  };
  </script>
</body>
</html>
