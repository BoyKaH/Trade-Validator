name: Construire l'APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Vérifier le SDK Android 35
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Construire l'APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Renommer l'APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Trade-Validator.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Trade-Validator-Android
          path: Trade-Validator.apk
          if-no-files-found: error
          retention-days: 30
